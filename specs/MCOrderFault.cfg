\* The fault model: a task can start twice (Guard = FALSE). The checker
\* must find two workers on one task (OneWorkerOneTask is violated).
SPECIFICATION Spec
CONSTANTS
    Items <- MCItems
    Size <- MCSize
    Need <- MCNeed
    Ordered <- MCOrdered
    Limit = 6
    Capacity = 2
    Tasks <- MCTasks
    Waits <- MCWaits
    Uses <- MCUses
    Workers <- MCWorkers
    ModelSize = 4
    Guard = FALSE
INVARIANT OneWorkerOneTask
