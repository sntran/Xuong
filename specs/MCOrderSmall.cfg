    Items <- MCItems
    Size <- MCSize
    Need <- MCNeed
    Ordered <- MCOrdered
    Limit = 3
    Capacity = 2
    Tasks <- MCTasks
    Waits <- MCWaits
    Uses <- MCUses
    Workers <- MCWorkers
    ModelSize = 4
    Guard = TRUE
INVARIANT InLimit
