\* The small model of Order: each invariant holds, and each order is
\* delivered in the end.
SPECIFICATION Spec
CONSTANTS
    Items <- MCItems
    Size <- MCSize
    Need <- MCNeed
    Ordered <- MCOrdered
    Limit = 6
    Capacity = 2
    Tasks <- MCTasks
    Waits <- MCWaits
    Uses <- MCUses
    Workers <- MCWorkers
    ModelSize = 4
    Guard = TRUE
INVARIANT InLimit Conservation InCapacity OneWorkerOneTask WaitsFirst
PROPERTY Delivers
